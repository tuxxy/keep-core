[package]
name = "k02-host-model"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false
description = "Finite Stateright model of the keep-core K-02 host store and fencing protocol. Verification tooling only."

[dependencies]
stateright = "=0.31.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
debug = false
